version: '3.8'

services:
  # 1. Container Aplikasi (Backend Laravel 12 & PHP 8.4)
  app:
    build:
      context: .
      dockerfile: docker/php/DockerFile
    container_name: simora-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8001:8000"
      - "5174:5174"
    volumes:
      - ./:/var/www/html:Z
    networks:
      apps-network:
        ipv4_address: 10.20.1.20

  # 2. Web Server (Nginx) - Terpisah dari PHP
  nginx:
    image: nginx:alpine
    container_name: simora-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:Z
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:Z
    depends_on:
      - app
    networks:
      apps-network:
        ipv4_address: 10.20.1.10

  # 3. Database Server (MySQL)
  mysql:
    image: mysql:8.4
    container_name: simora-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_simora
      MYSQL_USER: simora_user
      MYSQL_PASSWORD: simora_password
      MYSQL_ROOT_PASSWORD: root_password_simora
    ports:
      - "3307:3306"
    volumes:
      - simora-db-data:/var/lib/mysql:Z
    networks:
      apps-network:
        ipv4_address: 10.20.1.30

networks:
  apps-network:
    external: true

volumes:
  simora-db-data:
