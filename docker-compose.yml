services:
  # 1. Container Aplikasi (Backend Laravel 12 & PHP 8.4)
  # Sesuai kebutuhan backend di dokumen [cite: 1586]
  app:
    build:
      context: .
      dockerfile: docker/php/DockerFile
    container_name: simora-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8001:8000"
      - "5174:5174"
    volumes:
      - ./:/var/www/html:Z
    networks:
      - simora-network
      - database

  # 2. Web Server (Nginx) - Terpisah dari PHP
  # Melayani request HTTP dan file statis [cite: 1576]
  nginx:
    image: nginx:alpine
    container_name: simora
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html:Z
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:Z
    depends_on:
      - app
    networks:
      - simora-network
      - proxy

networks:
  simora-network:
    driver: bridge
  proxy:
    external: true
  database:
    external: true

