services:
  # 1. Container Aplikasi (Backend Laravel 12 & PHP 8.4)
  app:
    build:
      context: .
      dockerfile: docker/php/DockerFile
    container_name: simora-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8001:8000"
      - "5174:5174"
    volumes:
      - ./:/var/www/html:Z
    depends_on:
      - mariadb
    networks:
      - simora-network
      - database

  # 2. Web Server (Nginx) - Terpisah dari PHP
  nginx:
    image: nginx:alpine
    container_name: simora
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html:Z
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:Z
    depends_on:
      - app
    networks:
      - simora-network
      - proxy

  # 3. Database Server (MySQL 8.0)
  mariadb:
    image: mysql:8.0
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mariapassword
      MYSQL_DATABASE: db_simora
      MYSQL_USER: simora_user
      MYSQL_PASSWORD: simora_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - simora-network
      - database

volumes:
  mariadb_data:

networks:
  simora-network:
    driver: bridge
  proxy:
    external: true
  database:
    external: true

